# Linux build worker (docs/ARCHITECTURE.md §7). Started only by the Git2App API through
# workflow_dispatch; inputs carry ids, never secrets. The job proves who it is to the API with
# its GitHub OIDC token, and the API checks this repo, this file, the main branch and the event.
name: g2a-job
run-name: ${{ inputs.job_kind }} ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Git2App job id
        required: true
        type: string
      job_kind:
        description: analysis or build
        required: true
        type: choice
        options: [analysis, build]
      api_origin:
        description: Git2App API origin (must equal the G2A_API_ORIGIN repository variable)
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    outputs:
      needs_signing: ${{ steps.runner.outputs.needs_signing }}
    env:
      JOB_ID: ${{ inputs.job_id }}
      JOB_KIND: ${{ inputs.job_kind }}
      API_INPUT: ${{ inputs.api_origin }}
      API: ${{ vars.G2A_API_ORIGIN }}
    steps:
      - name: Check inputs
        run: |
          [[ "$JOB_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "bad job id"; exit 1; }
          [[ -n "$API" && "$API_INPUT" == "$API" ]] || { echo "api_origin does not match G2A_API_ORIGIN"; exit 1; }

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Git2App (no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - uses: actions/setup-java@v4
        if: inputs.job_kind == 'build'
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        if: inputs.job_kind == 'build'
        run: scripts/worker/setup-android.sh

      - name: Build sandbox
        if: inputs.job_kind == 'build'
        run: scripts/worker/setup-linux.sh

      - name: Run job
        id: runner
        run: node packages/runner/bin/g2a-runner.ts "$JOB_KIND" --job "$JOB_ID" --api "$API"

      # Release builds stop unsigned. The unsigned outputs go to the signing job, which runs on a
      # fresh VM and never executes the repository's code. tar keeps file modes intact.
      - name: Pack unsigned outputs
        if: steps.runner.outputs.needs_signing == 'true'
        env:
          HANDOFF: ${{ steps.runner.outputs.handoff }}
        run: tar -C "$HANDOFF" -cf "$RUNNER_TEMP/handoff.tar" .

      - uses: actions/upload-artifact@v4
        if: steps.runner.outputs.needs_signing == 'true'
        with:
          name: handoff-${{ inputs.job_id }}
          path: ${{ runner.temp }}/handoff.tar
          retention-days: 1
          if-no-files-found: error

  sign:
    needs: run
    if: needs.run.outputs.needs_signing == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The API releases signing keys only to a token from this environment, in this same run.
    environment: g2a-signing
    permissions:
      contents: read
      id-token: write
    env:
      JOB_ID: ${{ inputs.job_id }}
      API: ${{ vars.G2A_API_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android build tools
        run: scripts/worker/setup-android.sh

      - uses: actions/download-artifact@v4
        with:
          name: handoff-${{ inputs.job_id }}
          path: ${{ runner.temp }}/in

      - name: Sign
        run: |
          mkdir -p "$RUNNER_TEMP/handoff"
          tar -C "$RUNNER_TEMP/handoff" -xf "$RUNNER_TEMP/in/handoff.tar"
          node packages/runner/bin/g2a-runner.ts sign --job "$JOB_ID" --api "$API" --handoff "$RUNNER_TEMP/handoff"
